    cockpit demo 启动 5 分钟 Workspace 演示 wizard (4 步: 形成研究对象 → 继续追问 → 发布 → 复盘)。


    ## 使用模式

    cockpit demo                    # 启动 wizard (默认立即退出, 单页打印)

    cockpit demo --no-wait          # 同上 (alias)


    ## 实际行为

    - 打印 wizard 第一页 (欢迎语 + Step 1/4)

    - 不进入交互循环

    - exit=0 (立即返回)

    - 实际 step 内容由 ollama 真实生成 (无 ollama 时用 fallback 演示文本)


    ## 何时使用

    - 新人 5 分钟了解 Workspace 流程

    - 演示文档录制

    - 验证 KOS pipeline 端到端


    ## 退路

    - 详细能力地图: cockpit help

    - 上手向导: cockpit quickstart

    - 单步研究: cockpit research "主题"

    '
