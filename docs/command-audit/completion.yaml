  auditor: agent:cli-ledger-batch11
  summary: Shell 自动补全脚本生成 (bash/zsh/fish)
  description: 'cockpit completion 生成 shell 自动补全脚本, source 加载即可用 tab 补全。


    ## 使用

    cockpit completion bash    # bash 补全脚本 (source <(cockpit completion bash))

    cockpit completion zsh     # zsh 补全 (#compdef cockpit)

    cockpit completion fish    # fish 补全


    ## 何时使用

    - 每次新开 terminal 想要 tab 补全 cockpit 命令

    - 加到 ~/.bashrc / ~/.zshrc / ~/.config/fish/completions/


    ## 退路

    - 无: 这是辅助工具, 不工作可手动敲命令'
