  description: '

    cockpit model-driven 是 Model-Driven 独立 CLI 的 cockpit 入口。**已弃用** (ADR-0240 D1)。


    ## 弃用原因

    - Model-Driven 独立 CLI 与 cockpit 重复

    - cockpit 仓已提供等价命令 (cockpit mof + cockpit model-freshness + cockpit capabilities)

    - 维护两份 CLI 浪费工程资源


    ## 迁移路径

    - 原 model-driven CLI → cockpit mof / cockpit model-freshness

    - 需 MODEL_DRIVEN_CLI_LEGACY=1 环境变量才执行 (显式 opt-in)


    ## 何时会成功执行

    - 极少见: 遗留脚本迁移过渡期, 显式 opt-in


    ## 推荐

    所有新代码用 cockpit 仓命令。Model-Driven 仓代码保留但只读参考。

    '
