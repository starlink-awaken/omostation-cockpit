  description: "\ncockpit monitor 监控 C2G 双擎编排 (Sandbox/Planned/Active/Done 7 域状态)。\n\
    \n## 两种使用模式\n\n### 1. 实时 TUI 大盘 (默认, 1.5s 刷新)\ncockpit monitor               \
    \   # 进入 TUI 交互循环 (Ctrl+C 退出)\n\n### 2. 一次性快照 (批次 3 已修复, 不进入循环)\ncockpit monitor\
    \ --status         # 打印 layout 一次后退出\ncockpit monitor --no-tui         # 同 --status\n\
    \  → 输出: eCOS v6 C2G 双擎编排监控大盘 + 各域状态\n\n## 何时使用\n- 长时间监控多域状态 → 模式 1 (需 TTY)\n\
    - 脚本/管道抓取状态快照 → 模式 2\n- CI/CD 集成检查 → 模式 2\n\n## 退路\n- 不需监控: cockpit status\n-\
    \ 健康检查: cockpit gac\n"
