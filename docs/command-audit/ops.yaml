  auditor: agent:cli-ledger-batch5
  summary: omostation ops — Service Gateway (默认 status; up/down/deploy/discover/generate
    子命令)
  description: '

    cockpit ops 桥接到 bin/ops/cli.py (Service Gateway), 提供服务生命周期管理。


    ## 子命令 (10 个)

    cockpit ops status               # 列出所有服务状态 (默认)

    cockpit ops status --json        # JSON 输出

    cockpit ops up                   # 启动所有服务

    cockpit ops down                 # 停止所有服务

    cockpit ops deploy <service>     # 部署单个服务

    cockpit ops deps                 # 依赖图

    cockpit ops logs                 # 服务日志

    cockpit ops summary              # 摘要

    cockpit ops discover             # 发现新服务

    cockpit ops discover --update    # 发现并更新注册表

    cockpit ops validate             # 验证服务契约

    cockpit ops generate             # 生成 docker-compose / systemd / launchd


    ## 使用模式

    cockpit ops                      # 默认 status, exit=0

    cockpit ops --json               # JSON 格式

    cockpit ops --dry-run            # 预检, 不真的执行

    cockpit ops --profile minimal    # minimal profile (最小化服务)


    ## 何时使用

    - 查看服务运行状态 → status

    - 部署新服务 → up / deploy

    - 容器化输出 → generate --format docker-compose

    - 验证服务契约 → validate


    ## 退路

    - 服务状态: cockpit status

    - 健康检查: cockpit gac

    '
