  summary: 可观测性遥测 (status/export/reset/diagnostics)
  description: 'cockpit telemetry 提供 OpenTelemetry 风格的事件导出与状态查询。


    ## 使用

    cockpit telemetry status         # 当前遥测状态

    cockpit telemetry export         # 导出遥测数据

    cockpit telemetry reset          # 重置遥测

    cockpit telemetry diagnostics    # 诊断信息


    ## 何时使用

    - 调试命令慢

    - 导出使用记录到 Prometheus / Jaeger

    - 排查 agent 失败


    ## 退路

    - cockpit ops (服务状态)

    - cockpit monitor (实时监控)'
